name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Format, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format-check

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Upload API unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-unit-test-report
          path: packages/api/test-report/unit/
          retention-days: 14
